[package]
name = "velocity-core"
version = "3.0.0"
description = "VELOCITY CORE APEX — 2026-standard macOS System Orchestrator"
edition = "2021"

[[bin]]
name = "velocity-core"
path = "src/main.rs"

[lib]
name = "velocity_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell        = "2"
tauri-plugin-notification = "2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tokio         = { version = "1", features = ["full"] }
anyhow        = "1"
parking_lot   = "0.12"
log           = "0.4"
env_logger    = "0.11"
rand          = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
