name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Validate Desktop Frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install & Validate Web Companion
        run: |
          cd web
          npm ci
          npx vite build
